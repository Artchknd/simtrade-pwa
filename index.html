const TUT=`<div class=card><h3>1. 這是什麼</h3><p>你有 $100,000 初始資金。每按一次「下一日」就過一個交易日，股價會隨大盤、板塊、新聞與公司事件變動。目標：讓「淨資產」超過初始資金。也可按「自動播放」。</p></div><div class=card><h3>2. 怎麼買賣</h3><p>行情頁 → 點股票 → 選股數與槓桿 → 確認。要賣出就到持倉頁點該股票，選「賣出」。看跌也可「放空」。</p></div><div class=card><h3>3. 我買了，怎麼看回報？</h3><p>到「持倉」頁，每檔都有：<br>均價 = 你的平均買價；現價 = 今日價格<br><b>未實現損益 = (現價 − 均價) × 股數</b><br><b>報酬率 = 未實現損益 ÷ 自有資金</b><br>例：10 股 @100 買入，現價 110 → 損益 +$100，報酬率 +10%。賣出後才變成「已實現」，並可在「流水」核對現金變化與手續費。</p></div><div class=card><h3>4. 槓桿是雙面刃</h3><p>買 $1,000 的股票，5x 槓桿只需 $200 保證金。漲 10% 賺 $100，報酬率 +50%；跌 10% 賠 $100，報酬率 −50%；跌約 16% 權益見底就被強制平倉。槓桿還要付融資利息。</p></div><div class=card><h3>5. 看新聞找方向</h3><p>行情頁「市場快訊」列出事件與受影響板塊（綠色利多、紅色利空）。例如升息通常壓抑科技與房地產、利於銀行。</p></div><div class=card><h3>6. 貸款</h3><p>現金不夠時到「銀行」借款：利率看基準利率與信用分數，1% 開辦費，30 個交易日到期，借款後 10 日冷卻。逾期會被重罰。借錢投資前要確認：預期報酬 > 利息。</p></div>`;

function openP(i,dir,q,lv){if(q<1)return T("股數至少 1");const o=S.pos[i];if(o&&Math.sign(o.q)!=dir)return T("請先平倉反向部位");const p=P(i),n=q*p,fee=n*.001,m=n/lv;if(m+fee>S.cash)return T("現金不足以支付保證金與手續費");
L(dir>0?"買入":"放空",`${ST[i].k} ${q} 股 @ ${f(p)}（${lv}x）`,-m);L("手續費",ST[i].k+" 開倉手續費",-fee);
if(o){const a=Math.abs(o.q);o.avg=(a*o.avg+n)/(a+q);o.q+=dir*q;o.m+=m}else S.pos[i]={q:dir*q,avg:p,m};T("已成交")}
function closeP(i,q,fz){const o=S.pos[i],a=Math.abs(o.q);q=Math.min(Math.floor(q),a);if(q<1)return T("股數至少 1");const p=P(i),fr=q/a,pnl=Math.sign(o.q)*q*(p-o.avg),rel=Math.max(0,o.m*fr+pnl),fee=q*p*.001;
L(fz?"強制平倉":o.q>0?"賣出":"回補",`${ST[i].k} ${q} 股 @ ${f(p)}｜損益 ${f(pnl)}`,rel);L("手續費",ST[i].k+" 平倉手續費",-fee);S.real+=pnl-fee;o.m-=o.m*fr;o.q-=Math.sign(o.q)*q;if(Math.abs(o.q)<1)delete S.pos[i];if(!fz)T("已成交")}

if(S.loans.some(l=>l.od))return T("有逾期貸款，銀行暫停放款");if(S.cr<500)return T("信用分數低於 500，銀行拒絕放款");if(cd>0)return T(`冷卻期中，還需 ${cd} 個交易日`);
if(a<1000)return T("最低貸款 $1,000");if(a>av)return T("超過可用額度 "+f(Math.max(0,av),0));

function vSave(){return `<div class=card><b>自動存檔</b><div class=m id=cs style="margin-top:4px"></div></div><div class=card><h3>匯出存檔</h3><p class=m>產生一段文字，貼到另一台裝置的「匯入」即可接關。</p><button style="width:100%" onclick="expSave()">產生匯出碼</button><textarea id=xp rows=5 readonly style="${TA}" onclick="this.select()"></textarea><button class=s style="width:100%;margin-top:6px" onclick="cpSave()">複製</button><button class=s style="width:100%;margin-top:6px" onclick="dlSave()">儲存為檔案</button></div><div class=card><h3>匯入存檔</h3><p class=m>貼上匯出碼。匯入會覆蓋目前進度，請先確認。</p><textarea id=im rows=5 style="${TA}"></textarea><button style="width:100%;margin-top:6px" onclick="impSave()">匯入並覆蓋目前進度</button><div class=m style="margin-top:8px">或選擇存檔檔案：</div><input type=file accept=".txt,.json" onchange="flSave(this)"></div><div class=card><p class=m>匯出碼為壓縮後的明文編碼（不加密），只保留最近 8 日價格走勢，較早的圖表匯入時會重新生成。內容只有遊戲資料，但匯入前請只貼上你信任的來源。</p></div>`}
async function expSave(){const s=await encSave();$("#xp").value=s;$("#xp").select();T("已產生，共 "+s.length+" 字元")}
async function cpSave(){const e=$("#xp");if(!e.value)await expSave();try{await navigator.clipboard.writeText(e.value);T("已複製")}catch(x){e.select();document.execCommand("copy");T("已選取，若未複製請手動複製")}}
async function impSave(src){try{const o=JSON.parse(await decodeSave(src??$("#im").value));
if(!Array.isArray(o.h)||o.h.length!=ST.length||!o.h.every(a=>Array.isArray(a)&&a.length>1)||!Array.isArray(o.ix)||o.ix.length<2||!Array.isArray(o.nw)||o.nw.length<2||!Array.isArray(o.loans)||typeof o.cash!="number"||!o.pos||typeof o.pos!="object"||!Array.isArray(o.sm)||!Array.isArray(o.mo))throw 0;
const cs=x=>String(x).replace(/[<>&"]/g,"");o.news=(o.news||[]).map(n=>({d:+n.d,t:cs(n.t),g:/^(<span class="[ud]">[^<>]*<\/span> ?)*$/.test(n.g)?n.g:""}));o.ledger=(o.ledger||[]).map(e=>({d:+e.d,t:cs(e.t),s:cs(e.s),a:+e.a,b:+e.b}));
o.h.forEach(a=>{while(a.length<60)a.unshift(+(a[0]/(1+randn()*.012)).toFixed(2))});while(o.ix.length<60)o.ix.unshift(o.ix[0]*(1+randn()*.004));S=o;sv(1);AUTO=0;arm();closeSh();$("#over").style.display=S.over?"flex":"none";nav("mkt");T("匯入成功，已接續進度")}catch(e){T("匯入失敗：格式不正確")}}
function rst(){try{localStorage.removeItem("fm1")}catch(e){}init();sv(1);AUTO=0;arm();closeSh();$("#over").style.display="none";nav("mkt")}
try{const j=localStorage.getItem("fm1");S=j?JSON.parse(j):null}catch(e){S=null}
if(!S||!S.h||S.h.length!=ST.length||!S.ix)init();
arm();nav("mkt");if(S.over)$("#over").style.display="flex";
stat();
</script><script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));}</script></body></html>
