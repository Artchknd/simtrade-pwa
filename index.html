const TUT=`<div class=card><h3>1. 這是什麼</h3><p>你有 $100,000 初始資金。時間會自動流動（預設現實 1 秒 = 遊戲 1 分鐘），股價隨大盤、板塊、新聞與公司事件變動。股市只在週一至週五 09:30–16:00 交易，加密貨幣 24/7。目標：讓「總淨資產」超過初始資金。可在上方暫停或調速。</p></div><div class=card><h3>2. 怎麼買賣</h3><p>行情頁 → 點股票 → 選股數與槓桿 → 確認。要賣出就到持倉頁點該股票，選「賣出」。看跌也可「放空」。</p></div><div class=card><h3>3. 我買了，怎麼看回報？</h3><p>到「持倉」頁，每檔都有：<br>均價 = 你的平均買價；現價 = 今日價格<br><b>未實現損益 = (現價 − 均價) × 股數</b><br><b>報酬率 = 未實現損益 ÷ 自有資金</b><br>例：10 股 @100 買入，現價 110 → 損益 +$100，報酬率 +10%。賣出後才變成「已實現」，並可在「流水」核對現金變化與手續費。</p></div><div class=card><h3>4. 槓桿是雙面刃</h3><p>買 $1,000 的股票，5x 槓桿只需 $200 保證金。漲 10% 賺 $100，報酬率 +50%；跌 10% 賠 $100，報酬率 −50%；跌約 16% 權益見底就被強制平倉。槓桿還要付融資利息。</p></div><div class=card><h3>5. 看新聞找方向</h3><p>行情頁「市場快訊」列出事件與受影響板塊（綠色利多、紅色利空）。例如升息通常壓抑科技與房地產、利於銀行。</p></div><div class=card><h3>6. 貸款</h3><p>現金不夠時到「銀行」借款：利率看基準利率與信用分數，1% 開辦費，30 個交易日到期，借款後 10 日冷卻。逾期會被重罰。借錢投資前要確認：預期報酬 > 利息。</p></div>`;
const MODEL=`<div class=card><h3>價格如何產生</h3><p><b>每日報酬 = β × 大盤因子 + 板塊因子 + 個股雜訊 + 事件衝擊 + 長期趨勢</b></p><p>大盤因子：隨機波動加上總經事件（升降息、通膨、關稅、GDP）的殘留衝擊，每日衰減約 35%，重大消息後波動會放大。<br>板塊因子：12 個板塊各有 β、波動度與長期漂移。起始情境偏多 AI 與半導體、醫療、國防，偏弱能源與汽車，大致反映 AI 投資熱潮、高利率環境與地緣政治不確定。<br>事件：約每 5 個交易日出現一則總經或產業快訊（升降息、油價、出口管制、疫情、補貼等），依邏輯推升或壓抑相關板塊；另有隨機個股事件（財報、召回、訂單）。<br>利率：事件會改變基準利率，直接連動貸款與融資利率。</p><p>加密貨幣使用獨立模型：24/7 交易，共同的加密因子隨「牛熊情緒」緩慢切換，波動大，偶有暴漲暴跌的跳躍。</p><p class=m>初始價格為近似的虛擬數值，公司與事件僅供遊戲，不構成投資建議。</p></div><button class=s style="width:100%" onclick="rst()">重置存檔並重新開始</button>`;

async function decodeSave(t){t=t.replace(/\s/g,"");if(t.startsWith("SIMTRADE1:"))return decodeURIComponent(escape(atob(t.slice(10))));if(!t.startsWith("SIMTRADE2:"))throw 0;const u=Uint8Array.from(atob(t.slice(10)),c=>c.charCodeAt(0));return await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).text()}
async function dlSave(){try{const data=await encSave();const blob=new Blob([data],{type:"text/plain;charset=utf-8"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="simtrade-day"+S.day+".txt";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);T("已準備存檔下載")}catch(e){T("下載失敗，請改用文字碼匯出")}}
function flSave(i){const f=i.files[0];if(f)f.text().then(t=>impSave(t));i.value=""}
function vSave(){return `<div class=card><b>自動存檔</b><div class=m id=cs style="margin-top:4px"></div></div><div class=card><h3>匯出存檔</h3><p class=m>產生一段文字，貼到另一台裝置的「匯入」即可接關。</p><button style="width:100%" onclick="expSave()">產生匯出碼</button><textarea id=xp rows=5 readonly style="${TA}" onclick="this.select()"></textarea><button class=s style="width:100%;margin-top:6px" onclick="cpSave()">複製</button><button class=s style="width:100%;margin-top:6px" onclick="dlSave()">儲存為檔案</button></div><div class=card><h3>匯入存檔</h3><p class=m>貼上匯出碼。匯入會覆蓋目前進度，請先確認。</p><textarea id=im rows=5 style="${TA}"></textarea><button style="width:100%;margin-top:6px" onclick="impSave()">匯入並覆蓋目前進度</button><div class=m style="margin-top:8px">或選擇存檔檔案：</div><input type=file accept=".txt,.json" onchange="flSave(this)"></div><div class=card><p class=m>匯出碼為壓縮後的明文編碼（不加密），只保留最近 8 日價格走勢，較早的圖表匯入時會重新生成。內容只有遊戲資料，但匯入前請只貼上你信任的來源。</p></div>`}
async function expSave(){const s=await encSave();$("#xp").value=s;$("#xp").select();T("已產生，共 "+s.length+" 字元")}
async function cpSave(){const e=$("#xp");if(!e.value)await expSave();try{await navigator.clipboard.writeText(e.value);T("已複製")}catch(x){e.select();document.execCommand("copy");T("已選取，若未複製請手動複製")}}
async function impSave(src){try{const o=JSON.parse(await decodeSave(src??$("#im").value));
if(!Array.isArray(o.b)||o.b.length!=ST.length||!o.b.every(a=>Array.isArray(a)&&a.length>1&&a.every(q=>Array.isArray(q)&&q.length==5&&q.every(Number.isFinite)))||!Array.isArray(o.ix)||o.ix.length<2||!Array.isArray(o.nw)||o.nw.length<2||!Array.isArray(o.loans)||typeof o.cash!="number"||!o.pos||typeof o.pos!="object"||!Array.isArray(o.sm)||!Array.isArray(o.mo))throw 0;
const cs=x=>String(x).replace(/[<>&"]/g,"");o.news=(o.news||[]).map(n=>({d:+n.d,t:cs(n.t),g:/^(<span class="[ud]">[^<>]*<\/span> ?)*$/.test(n.g)?n.g:""}));o.ledger=(o.ledger||[]).map(e=>({d:+e.d,t:cs(e.t),s:cs(e.s),a:+e.a,b:+e.b}));
S=o;SPD=o.sp|0;sv(1);AUTO=0;arm();closeSh();$("#over").style.display=S.over?"flex":"none";nav("mkt");T("匯入成功，已接續進度")}catch(e){T("匯入失敗：格式不正確")}}
function rst(){try{localStorage.removeItem("fm2")}catch(e){}init();sv(1);AUTO=0;arm();closeSh();$("#over").style.display="none";nav("mkt")}
try{const j=localStorage.getItem("fm2");S=j?JSON.parse(j):null}catch(e){S=null}
if(!S||!S.b||S.b.length!=ST.length||!S.ix)init();AUTO=S.run!==0;SPD=S.sp|0;
arm();nav("mkt");if(S.over)$("#over").style.display="flex";
stat();
document.addEventListener("pointerdown",e=>{PD=1;const b=e.target.closest&&e.target.closest("button,.row");if(b){const r=b.getBoundingClientRect(),d=Math.max(r.width,r.height)*2,p=document.createElement("span");p.className="rp";p.style.cssText=`width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`;b.appendChild(p);setTimeout(()=>p.remove(),600)}});
addEventListener("pointerup",()=>PD=0);addEventListener("pointercancel",()=>PD=0);addEventListener("pagehide",()=>sv());
document.addEventListener("visibilitychange",()=>{if(document.hidden)sv()});
addEventListener("keydown",e=>{if(e.key=="Escape")closeSh();else if(e.key==" "&&!/INPUT|TEXTAREA|SELECT|BUTTON/.test(e.target.tagName)){e.preventDefault();tg()}});
